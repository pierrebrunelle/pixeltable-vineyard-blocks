[project]
name = "pixeltable-vineyard-blocks"
version = "0.1.0"
description = "Vineyard estate API: blocks, vines, harvests and tastings as four related Pixeltable tables with yield UDFs - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "fastapi", "computed-columns", "data-infrastructure", "vineyard-blocks"]
dependencies = [
    "pixeltable[serve]>=0.7.14",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
